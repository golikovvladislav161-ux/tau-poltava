<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAU — Адмін-панель</title><link rel="stylesheet" href="styles.css"><style>body{padding:30px}.admin{max-width:1000px;margin:auto}.admin h1{font:44px "Cormorant Garamond";color:var(--gold2)}.admin form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;background:#14110e;padding:22px;border:1px solid var(--line);border-radius:18px}.admin input,.admin textarea,.admin select{background:#080706;border:1px solid var(--line);padding:13px;color:white;border-radius:8px;font:inherit}.admin textarea{grid-column:1/-1}.admin button{cursor:pointer}.admin-list{margin-top:24px}.admin-item{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid var(--line)}@media(max-width:600px){.admin form{grid-template-columns:1fr}}</style></head><body><main class="admin"><a class="brand" href="index.html"><span>TAU</span><small>ADMINISTRATION</small></a><h1>Редактор меню</h1><p class="muted">Демо-редактор: зміни зберігаються в браузері цього пристрою. Для справжньої адмін-панелі потрібні сервер, база даних та авторизація.</p><form id="form"><input name="name" placeholder="Назва страви" required><select name="category"><option>Сети</option><option>Роли</option><option>Суші</option><option>Сніданки</option><option>Супи</option><option>Салати</option></select><input name="weight" placeholder="Вага, наприклад 250 г"><input name="price" type="number" placeholder="Ціна, грн" required><textarea name="description" placeholder="Опис страви"></textarea><button class="gold-button">Додати страву</button></form><div class="admin-list" id="list"></div></main><script>const key='tau-menu-edits';let items=JSON.parse(localStorage.getItem(key)||'[]');function draw(){document.querySelector('#list').innerHTML=items.map((x,i)=>`<div class="admin-item"><span><b>${x.name}</b><br><small>${x.category} · ${x.price} ₴</small></span><button data-del="${i}">Видалити</button></div>`).join('')}document.querySelector('#form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));items.push(d);localStorage.setItem(key,JSON.stringify(items));e.target.reset();draw()};document.querySelector('#list').onclick=e=>{if(e.target.dataset.del!==undefined){items.splice(+e.target.dataset.del,1);localStorage.setItem(key,JSON.stringify(items));draw()}};draw();</script></body></html>
